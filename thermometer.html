<!DOCTYPE html>
<html>

<head>

<title>Thermometer</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:25px;

}



h1 {

    font-size:45px;
    text-shadow:0 0 20px cyan;

}



#thermometer {

    width:360px;
    margin:auto;

    background:#181818;

    border:5px solid #555;

    border-radius:35px;

    padding:30px;

    box-shadow:
    0 0 35px black;

}



#screen {

    background:#001522;

    height:150px;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:65px;

    color:#00ffff;

    box-shadow:
    0 0 30px cyan;

    transition:0.5s;

}



#tube {

    width:45px;

    height:150px;

    background:#333;

    border-radius:30px;

    margin:25px auto;

    overflow:hidden;

    position:relative;

}



#liquid {

    position:absolute;

    bottom:0;

    width:100%;

    height:50%;

    background:cyan;

    transition:1s;

}



#status {

    font-size:25px;

    margin-top:20px;

}



#debug {

    margin-top:25px;

    color:#777;

    font-size:18px;

}



</style>

</head>



<body>



<h1>🌡️ Thermometer</h1>



<div id="thermometer">


<div id="screen">

20.0°C

</div>



<div id="tube">

<div id="liquid"></div>

</div>



<div id="status">

Scanning...

</div>


<div id="debug">

</div>



</div>






<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let temperature = 20;







function getTargetTemperature(){



if(!ghost){

return 20;

}



let distance =
ghost.distance || 1.5;



let target = 20;



// closer ghost = colder


if(distance <= 0.3){

target = 6;

}

else if(distance <= 0.7){

target = 10;

}

else if(distance <= 1.2){

target = 15;

}





// freezing ghost

if(
ghost.evidence.includes(
"Freezing Temps"
)
&&
distance <= 0.8
){

target = -5;

}



return target;



}









function updateThermometer(){



ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let target =
getTargetTemperature();



// gradual movement

temperature +=
(target - temperature) * 0.05;



let screen =
document.getElementById("screen");



screen.innerHTML =
temperature.toFixed(1)
+
"°C";






// tube animation


let height =
Math.max(
10,
Math.min(
100,
temperature * 5
)
);



document.getElementById("liquid")
.style.height =
height+"%";








if(temperature <= 0){


screen.style.color="#66ccff";

screen.style.boxShadow=
"0 0 60px cyan";


document.getElementById("status")
.innerHTML =
"❄ FREEZING TEMPERATURES";



}

else if(temperature < 10){



screen.style.color="cyan";


document.getElementById("status")
.innerHTML =
"🥶 Very cold air detected";



}

else{


screen.style.color="white";


screen.style.boxShadow=
"0 0 30px cyan";


document.getElementById("status")
.innerHTML =
"Scanning...";


}





// testing information


if(ghost){


document.getElementById("debug")
.innerHTML =

"🧪 Testing Mode"
+
"<br>Ghost: "
+
ghost.name
+
"<br>Distance: "
+
ghost.distance
+
"m"
+
"<br>Evidence: "
+
ghost.evidence.join(", ");



}




setTimeout(
updateThermometer,
1000
);



}





updateThermometer();



</script>



</body>

</html>
