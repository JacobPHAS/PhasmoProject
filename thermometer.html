<!DOCTYPE html>
<html>

<head>

<title>Thermometer</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}


h1 {
    font-size:45px;
    text-shadow:0 0 20px cyan;
}



#device {

    width:360px;
    margin:40px auto;
    padding:30px;

    background:#151515;

    border:4px solid #444;

    border-radius:30px;

    box-shadow:0 0 30px black;

}




#temperature {

    background:#001820;

    padding:30px;

    border-radius:20px;

    font-size:60px;

    color:#00ffff;

    box-shadow:0 0 25px cyan;

}




#tube {

    width:45px;

    height:180px;

    margin:30px auto;

    background:#222;

    border-radius:30px;

    overflow:hidden;

    position:relative;

}



#liquid {

    position:absolute;

    bottom:0;

    width:100%;

    height:50%;

    background:red;

    transition:1s;

}





#status {

    font-size:25px;

    margin-top:20px;

}





/* FLOATING COMPASS */

#miniCompass {

    position:fixed;

    right:20px;

    bottom:20px;

    width:150px;

    z-index:999;

}




#compassCircle {

    width:130px;

    height:130px;

    border-radius:50%;

    border:4px solid white;

    background:#111;

    position:relative;

    cursor:grab;

    box-shadow:0 0 25px cyan;

}





#redNeedle {

    position:absolute;

    width:4px;

    height:55px;

    background:red;

    left:63px;

    top:10px;

    transform-origin:bottom center;

    box-shadow:0 0 15px red;

}





#north {

    position:absolute;

    top:5px;

    left:60px;

    font-weight:bold;

}





#compassText {

    margin-top:8px;

    font-size:18px;

}





#debug {

    margin-top:20px;

    color:#777;

}


</style>

</head>



<body>



<h1>🌡️ Thermometer</h1>



<div id="device">



<div id="temperature">
20.0°C
</div>




<div id="tube">

<div id="liquid"></div>

</div>




<div id="status">
Scanning...
</div>




<div id="debug"></div>



</div>





<div id="miniCompass">


<div id="compassCircle">


<div id="redNeedle"></div>


<div id="north">
N
</div>


</div>



<div id="compassText">
0°
</div>


</div>








<script>



let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let temperature = 20;


let playerDirection = 0;





// COMPASS DRAGGING


let compass =
document.getElementById(
"compassCircle"
);



let dragging=false;



compass.addEventListener(
"pointerdown",
()=>{

dragging=true;

});



window.addEventListener(
"pointerup",
()=>{

dragging=false;

});




window.addEventListener(
"pointermove",
(e)=>{


if(!dragging)
return;



let rect =
compass.getBoundingClientRect();



let x =
e.clientX -
(rect.left + rect.width/2);



let y =
e.clientY -
(rect.top + rect.height/2);



let angle =
Math.atan2(y,x)
*
180/Math.PI;



playerDirection =
Math.round(angle+90);



if(playerDirection<0){

playerDirection+=360;

}



document.getElementById(
"redNeedle"
)
.style.transform =
"rotate("
+
playerDirection
+
"deg)";



document.getElementById(
"compassText"
)
.innerHTML =
playerDirection+"°";



});







function facingGhost(){


if(!ghost)
return false;



let difference =
Math.abs(
playerDirection -
ghost.direction
);



if(difference>180){

difference =
360-difference;

}



return difference <45;


}







function getTargetTemperature(){



// Not facing ghost

if(!facingGhost()){

    return 15;

}




// Freezing evidence

if(
ghost.evidence.includes(
"Freezing Temps"
)
){

    return -5;

}




// Normal ghost

return 10;



}








function updateThermometer(){



ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let target =
getTargetTemperature();





let speed = 0.05;



if(facingGhost()){

    speed = 0.2;

}





temperature +=
(target-temperature)
*
speed;







document.getElementById(
"temperature"
)
.innerHTML =
temperature.toFixed(1)
+
"°C";






let liquidHeight =
Math.max(
5,
Math.min(
100,
temperature*5
)
);



document.getElementById(
"liquid"
)
.style.height =
liquidHeight+"%";








if(temperature<=0){


document.getElementById(
"status"
)
.innerHTML =
"❄ FREEZING TEMPERATURES";


}

else{


document.getElementById(
"status"
)
.innerHTML =
"Scanning...";


}








if(ghost){


document.getElementById(
"debug"
)
.innerHTML =

"🧪 Testing Mode"
+
"<br>Ghost: "
+
ghost.name
+
"<br>Ghost Direction: "
+
ghost.direction
+
"°"
+
"<br>Your Direction: "
+
playerDirection
+
"°"
+
"<br>Facing Ghost: "
+
facingGhost();


}






setTimeout(
updateThermometer,
1000
);


}





updateThermometer();



</script>



</body>

</html>
