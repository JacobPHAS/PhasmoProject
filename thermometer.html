<!DOCTYPE html>
<html>

<head>

<title>Thermometer</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
}


h1 {
    font-size:42px;
    text-shadow:0 0 20px cyan;
}


#device {

    width:360px;
    margin:auto;
    background:#181818;
    border:4px solid #555;
    border-radius:30px;
    padding:25px;

    box-shadow:0 0 30px black;

}



#screen {

    background:#001522;
    color:#00ffff;

    font-size:60px;

    padding:30px;

    border-radius:20px;

    box-shadow:0 0 30px cyan;

}



#compass {

    margin:25px;

    width:180px;
    height:180px;

    border:5px solid white;

    border-radius:50%;

    margin-left:auto;
    margin-right:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

}



button {

    padding:15px;

    font-size:20px;

    border-radius:15px;

}



#status {

    font-size:24px;

    margin:20px;

}


#debug {

    color:#777;

}

</style>

</head>



<body>


<h1>🌡️ Thermometer</h1>



<div id="device">


<div id="compass">

🧭
<br>
<span id="direction">
0°
</span>

</div>



<div id="screen">

20.0°C

</div>


<div id="status">

Scanning...

</div>



<button onclick="rotateCompass()">

Rotate Compass

</button>



<div id="debug">

</div>



</div>





<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let temperature = 20;


let playerDirection = 0;



// manual compass fallback

function rotateCompass(){

    playerDirection += 45;


    if(playerDirection >= 360){

        playerDirection = 0;

    }

}





// check if facing ghost

function facingGhost(){


    if(!ghost)
    return false;


    let difference =
    Math.abs(
        playerDirection -
        ghost.direction
    );


    if(difference > 180){

        difference =
        360-difference;

    }


    return difference < 45;


}







function targetTemperature(){



    if(!ghost){

        return 20;

    }




    if(!facingGhost()){

        return 15;

    }





    if(
    ghost.evidence.includes(
        "Freezing Temps"
    )
    ){

        return -5;

    }



    return 10;



}







function update(){



ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);




let target =
targetTemperature();



// faster when facing ghost

let speed = 0.05;


if(facingGhost()){

    speed = 0.20;

}





temperature +=
(target-temperature)
*
speed;




document.getElementById("screen")
.innerHTML =
temperature.toFixed(1)
+
"°C";





document.getElementById("direction")
.innerHTML =
playerDirection+"°";





if(temperature <=0){


document.getElementById("status")
.innerHTML =
"❄ FREEZING TEMPERATURES";


}


else if(temperature <15){


document.getElementById("status")
.innerHTML =
"🥶 Cold air detected";


}

else{


document.getElementById("status")
.innerHTML =
"Scanning...";


}






document.getElementById("debug")
.innerHTML =

"🧪 Testing Mode"
+
"<br>Ghost Direction: "
+
ghost.direction
+
"°"
+
"<br>Your Direction: "
+
playerDirection
+
"°"
+
"<br>Facing Ghost: "
+
facingGhost();





setTimeout(
update,
1000
);



}



update();



</script>


</body>

</html>
