<!DOCTYPE html>
<html>

<head>

<title>Thermometer</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:25px;

}



h1 {

    font-size:45px;
    text-shadow:0 0 20px cyan;

}



#thermometer {

    width:360px;
    margin:auto;

    background:#181818;

    border:5px solid #555;

    border-radius:35px;

    padding:30px;

    box-shadow:
    0 0 35px black;

}



#screen {

    background:#001522;

    height:150px;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:65px;

    color:#00ffff;

    box-shadow:
    0 0 30px cyan;

    transition:0.5s;

}



#tube {

    width:45px;

    height:150px;

    background:#333;

    border-radius:30px;

    margin:25px auto;

    overflow:hidden;

    position:relative;

}



#liquid {

    position:absolute;

    bottom:0;

    width:100%;

    height:50%;

    background:cyan;

    transition:1s;

}



#status {

    font-size:25px;

    margin-top:20px;

}



#debug {

    margin-top:25px;

    color:#777;

    font-size:18px;

}



</style>

</head>



<body>



<h1>🌡️ Thermometer</h1>



<div id="thermometer">


<div id="screen">

20.0°C

</div>



<div id="tube">

<div id="liquid"></div>

</div>



<div id="status">

Scanning...

</div>


<div id="debug">

</div>



</div>






<script>

let ghost = JSON.parse(
    localStorage.getItem("currentGhost")
);


let temperature = 20;



function isFacingGhost(){

    if(!ghost){
        return false;
    }


    if(typeof playerDirection === "undefined"){
        return false;
    }


    let difference =
    Math.abs(
        playerDirection - ghost.direction
    );


    if(difference > 180){

        difference = 360 - difference;

    }


    return difference < 45;

}





function getTargetTemperature(){


    let facing =
    isFacingGhost();



    // Not looking at ghost

    if(!facing){

        return 15;

    }



    // Looking at ghost

    if(
        ghost.evidence.includes(
            "Freezing Temps"
        )
    ){

        return -5;

    }


    // Normal ghost

    return 10;


}







function updateThermometer(){



    ghost = JSON.parse(
        localStorage.getItem("currentGhost")
    );



    let target =
    getTargetTemperature();



    // gradual temperature movement

    temperature +=
    (target - temperature) * 0.05;



    document.getElementById("screen")
    .innerHTML =
    temperature.toFixed(1)
    +
    "°C";




    if(temperature <= 0){


        document.getElementById("status")
        .innerHTML =
        "❄ FREEZING TEMPERATURES";


    }

    else if(temperature < 15){


        document.getElementById("status")
        .innerHTML =
        "🥶 Cold air detected";


    }

    else{


        document.getElementById("status")
        .innerHTML =
        "Scanning...";


    }




    setTimeout(
        updateThermometer,
        1000
    );


}




updateThermometer();


</script>
