<!DOCTYPE html>
<html>

<head>

<title>Thermometer</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;

}


h1 {

    font-size:45px;
    text-shadow:0 0 20px cyan;

}



#device {

    width:360px;

    margin:40px auto;

    background:#151515;

    border:4px solid #444;

    border-radius:35px;

    padding:30px;

    box-shadow:0 0 40px black;

}




#temperature {

    height:140px;

    background:#001b25;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:65px;

    color:#00ffff;

    box-shadow:0 0 30px cyan;

    transition:0.5s;

}




#tube {

    height:180px;

    width:45px;

    background:#333;

    border-radius:30px;

    margin:30px auto;

    position:relative;

    overflow:hidden;

}



#liquid {

    position:absolute;

    bottom:0;

    width:100%;

    height:50%;

    background:#00ffff;

    transition:1s;

}



#status {

    font-size:25px;

    margin-top:20px;

}



#miniCompass {


    position:fixed;


    right:20px;


    bottom:20px;


    width:130px;


    height:130px;


    border-radius:50%;


    border:4px solid white;


    background:#111;


    box-shadow:0 0 25px cyan;


    display:flex;


    align-items:center;


    justify-content:center;


    cursor:grab;


    user-select:none;


    z-index:999;


}



#needle {


    font-size:45px;

    pointer-events:none;

}



#compassText {


    position:absolute;


    bottom:8px;


    font-size:16px;

}



#debug {


    margin-top:25px;

    color:#777;

}



</style>

</head>


<body>


<h1>🌡️ Thermometer</h1>



<div id="device">


<div id="temperature">

20.0°C

</div>


<div id="tube">

<div id="liquid"></div>

</div>



<div id="status">

Scanning...

</div>


<div id="debug"></div>


</div>





<div id="miniCompass">


<div id="needle">

🧭

</div>


<div id="compassText">

0°

</div>


</div>






<script>


let ghost = JSON.parse(
localStorage.getItem("currentGhost")
);



let temperature = 20;


let playerDirection = 0;





// --------------------
// DRAG COMPASS
// --------------------


let compass =
document.getElementById("miniCompass");


let dragging = false;



compass.addEventListener(
"pointerdown",
()=>{

dragging=true;

});



window.addEventListener(
"pointerup",
()=>{

dragging=false;

});





window.addEventListener(
"pointermove",
(e)=>{


if(!dragging)
return;



let rect =
compass.getBoundingClientRect();



let centerX =
rect.left + rect.width/2;



let centerY =
rect.top + rect.height/2;



let angle =
Math.atan2(
e.clientY-centerY,
e.clientX-centerX
)
*
180/Math.PI;



playerDirection =
Math.round(angle+90);



if(playerDirection<0){

playerDirection+=360;

}



document.getElementById(
"compassText"
)
.innerHTML =
playerDirection+"°";



document.getElementById(
"needle"
)
.style.transform =
"rotate("
+
playerDirection
+
"deg)";


});







// --------------------
// CHECK DIRECTION
// --------------------


function facingGhost(){


if(!ghost)
return false;



let difference =
Math.abs(
playerDirection -
ghost.direction
);



if(difference>180){

difference =
360-difference;

}



return difference < 45;


}







// --------------------
// TEMPERATURE LOGIC
// --------------------


function getTargetTemp(){



if(!facingGhost()){


// cannot get colder than 15

return 15;


}




if(
ghost.evidence.includes(
"Freezing Temps"
)

){


return -5;


}


// normal ghost cold

return 10;



}








function updateThermometer(){



ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let target =
getTargetTemp();




// faster when facing ghost

let speed = 0.05;



if(facingGhost()){

speed = 0.18;

}



temperature +=
(target-temperature)
*
speed;




document.getElementById(
"temperature"
)
.innerHTML =
temperature.toFixed(1)
+
"°C";





let liquidHeight =
Math.max(
10,
Math.min(
100,
temperature*5
)
);



document.getElementById(
"liquid"
)
.style.height =
liquidHeight+"%";







if(temperature<=0){


document.getElementById(
"status"
)
.innerHTML =
"❄ FREEZING TEMPERATURES";


}


else if(temperature<15){


document.getElementById(
"status"
)
.innerHTML =
"🥶 Cold air detected";


}


else{


document.getElementById(
"status"
)
.innerHTML =
"Scanning...";


}






// testing


if(ghost){


document.getElementById(
"debug"
)
.innerHTML =

"🧪 Testing Mode"
+
"<br>Ghost: "
+
ghost.name
+
"<br>Ghost Direction: "
+
ghost.direction
+
"°"
+
"<br>Your Direction: "
+
playerDirection
+
"°"
+
"<br>Facing Ghost: "
+
facingGhost();



}



setTimeout(
updateThermometer,
1000
);


}



updateThermometer();



</script>


</body>

</html>
