<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:25px;
}


h1 {
    font-size:42px;
}


#device {

    width:340px;
    margin:auto;
    background:#111;
    border:6px solid #555;
    border-radius:35px;
    padding:25px;
    box-shadow:0 0 30px black;

}



#screen {

    height:160px;

    background:#001800;

    color:#00ff00;

    font-size:65px;

    font-weight:bold;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:0.3s;

    box-shadow:
    0 0 20px #00ff00;

}




#status {

    margin-top:20px;

    font-size:25px;

}



#compass {

    width:230px;

    height:230px;

    margin:35px auto;

    border:5px solid white;

    border-radius:50%;

    position:relative;

    touch-action:none;

}



#needle {

    position:absolute;

    width:8px;

    height:100px;

    background:red;

    left:111px;

    top:15px;

    transform-origin:bottom;

    border-radius:5px;

}



#direction {

    color:#aaa;

    font-size:20px;

}



</style>

</head>


<body>


<h1>📟 EMF Reader</h1>


<div id="device">


<div id="screen">
EMF 0
</div>


<div id="status">
Searching...
</div>



<div id="compass">

<div id="needle"></div>

</div>



</div>



<div id="direction">
Direction: 0°
</div>



<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let playerDirection = 0;

let currentEMF = 0;

let dragging = false;





// Compass control

let compass =
document.getElementById("compass");


let needle =
document.getElementById("needle");



compass.addEventListener(
"pointerdown",
()=>{

dragging=true;

});



window.addEventListener(
"pointerup",
()=>{

dragging=false;

});



window.addEventListener(
"pointermove",
function(e){


if(!dragging)
return;



let rect =
compass.getBoundingClientRect();



let x =
e.clientX -
(rect.left + rect.width/2);



let y =
e.clientY -
(rect.top + rect.height/2);



let angle =
Math.atan2(y,x)
*
180 /
Math.PI;



playerDirection =
angle + 90;



if(playerDirection < 0)
playerDirection += 360;



needle.style.transform =
"rotate("
+
playerDirection
+
"deg)";



document.getElementById("direction")
.innerHTML =
"Direction: "
+
Math.round(playerDirection)
+
"°";


});






function facingGhost(){


if(!ghost)
return false;



let difference =
Math.abs(
playerDirection -
ghost.direction
);



if(difference > 180){

difference =
360 - difference;

}



return difference < 35;


}






function getEMF(){



if(!facingGhost()){

return 0;

}



if(
ghost.evidence.includes(
"EMF Level 5")
){


if(
Math.random() < 0.15
){

return 5;

}

}



return Math.floor(
Math.random()*4
)+1;



}







// Sound generator

function makeBeep(level){


if(level <= 0)
return;



let audio =
new AudioContext();



let oscillator =
audio.createOscillator();



let gain =
audio.createGain();



oscillator.type =
"square";



// Higher level = higher pitch

oscillator.frequency.value =
250 + (level * 180);



gain.gain.value =
0.08;



oscillator.connect(gain);

gain.connect(
audio.destination
);



oscillator.start();



oscillator.stop(
audio.currentTime + 0.12
);



}






function updateEMF(){



currentEMF =
getEMF();



let screen =
document.getElementById("screen");



screen.innerHTML =
"EMF "
+
currentEMF;



let colour =
"#00ff00";

let glow =
"0 0 20px #00ff00";



if(currentEMF === 2){

colour="yellow";

glow="0 0 30px yellow";

}



if(currentEMF === 3){

colour="orange";

glow="0 0 35px orange";

}



if(currentEMF === 4){

colour="red";

glow="0 0 45px red";

}



if(currentEMF === 5){

colour="white";

glow="0 0 60px red";

screen.style.background="#990000";

}

else{

screen.style.background="#001800";

}



screen.style.color =
colour;


screen.style.boxShadow =
glow;



if(currentEMF > 0){

document.getElementById("status")
.innerHTML =
"⚠️ Signal Detected";

makeBeep(currentEMF);

}

else{

document.getElementById("status")
.innerHTML =
"Searching...";

}



let delay =
Math.random()*1200+500;



setTimeout(
updateEMF,
delay
);


}



updateEMF();



</script>


</body>

</html>
