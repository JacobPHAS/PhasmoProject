<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:40px;
}

h1 {
    font-size:40px;
}

#device {
    width:330px;
    height:500px;
    margin:auto;
    background:#111;
    border:6px solid #444;
    border-radius:30px;
    padding:20px;
}

#screen {
    height:160px;
    background:#001900;
    color:#00ff00;
    font-size:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:15px;
    margin-bottom:25px;
}

button {
    font-size:24px;
    padding:15px;
    margin:10px;
    border-radius:15px;
}

#direction {
    font-size:25px;
    margin-top:20px;
}

#status {
    font-size:25px;
    margin-top:20px;
}

#manual {
    display:none;
}

</style>

</head>


<body>


<h1>📟 EMF Reader</h1>


<div id="device">


<div id="screen">
EMF 0
</div>


<div id="status">
Checking sensors...
</div>


<div id="manual">

<h2>Manual Turning</h2>

<button onclick="turnLeft()">
⬅ Left
</button>

<button onclick="turnRight()">
Right ➡
</button>

</div>


</div>


<div id="direction">
Direction: 0°
</div>



<script>


let ghost = JSON.parse(
localStorage.getItem("currentGhost")
);



let phoneDirection = 0;

let compassWorking = false;



// Check compass

window.addEventListener(
"deviceorientation",
function(event){


    if(event.alpha !== null){

        compassWorking = true;

        phoneDirection = event.alpha;


    }


});



// Give manual mode time to detect compass

setTimeout(function(){


    if(!compassWorking){


        document.getElementById("manual")
        .style.display="block";


        document.getElementById("status")
        .innerHTML =
        "Manual mode";


    }
    else {


        document.getElementById("status")
        .innerHTML =
        "Compass mode";


    }


},3000);



// Manual controls

function turnLeft(){

    phoneDirection -= 30;


    if(phoneDirection < 0){
        phoneDirection += 360;
    }

}



function turnRight(){

    phoneDirection += 30;


    if(phoneDirection >= 360){
        phoneDirection -= 360;
    }

}



// Check direction

function facingGhost(){


    if(!ghost){
        return false;
    }


    let difference =
    Math.abs(
    phoneDirection -
    ghost.direction
    );


    if(difference > 180){

        difference =
        360 - difference;

    }


    return difference <= 35;

}



// EMF calculation

function getEMF(){


    if(!facingGhost()){

        return 0;

    }



    if(
    ghost.evidence.includes(
    "EMF Level 5")
    ){


        if(Math.random() < 0.15){

            return 5;

        }

    }



    return Math.floor(
    Math.random()*4
    )+1;


}



// Update display

setInterval(function(){


    let emf =
    getEMF();


    document.getElementById("screen")
    .innerHTML =
    "EMF " + emf;



    document.getElementById("direction")
    .innerHTML =
    "Direction: "
    +
    Math.round(phoneDirection)
    +
    "°";


},1000);



</script>


</body>

</html>
