<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:20px;
}


h1 {
    font-size:42px;
}


#device {

    width:340px;
    margin:auto;
    background:#111;
    border:6px solid #555;
    border-radius:35px;
    padding:25px;
    box-shadow:0 0 30px black;

}


#screen {

    height:150px;
    background:#001800;
    color:#00ff00;
    font-size:60px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:20px;

    transition:0.3s;

}


#status {

    font-size:24px;
    margin-top:20px;

}


#compass {

    width:230px;
    height:230px;

    border:5px solid white;
    border-radius:50%;

    margin:30px auto;

    position:relative;

    touch-action:none;

}


#needle {

    position:absolute;

    width:8px;
    height:100px;

    background:red;

    left:111px;
    top:15px;

    transform-origin:bottom;

    border-radius:10px;

}



#direction {

    color:#aaa;
    font-size:20px;

}


.hidden {
    display:none;
}


</style>

</head>


<body>


<h1>📟 EMF Reader</h1>



<div id="device">


<div id="screen">
EMF 0
</div>


<div id="status">
Starting...
</div>



<div id="compass">

<div id="needle"></div>

</div>


</div>



<div id="direction">
Direction: 0°
</div>





<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let playerDirection = 0;

let realCompass = false;

let dragging = false;

let currentEMF = 0;



const compass =
document.getElementById("compass");


const needle =
document.getElementById("needle");







// REAL PHONE ROTATION

window.addEventListener(
"deviceorientation",
function(event){


    if(event.alpha !== null){


        realCompass = true;


        playerDirection =
        event.alpha;



        compass.classList.add("hidden");


        document.getElementById("status")
        .innerHTML =
        "📱 Phone rotation mode";


    }


});







// MANUAL COMPASS


compass.addEventListener(
"pointerdown",
function(){

dragging = true;

});



window.addEventListener(
"pointerup",
function(){

dragging=false;

});



window.addEventListener(
"pointermove",
function(e){


if(realCompass)
return;


if(!dragging)
return;



let rect =
compass.getBoundingClientRect();



let x =
e.clientX -
(rect.left + rect.width/2);



let y =
e.clientY -
(rect.top + rect.height/2);



let angle =
Math.atan2(y,x)
*
180 /
Math.PI;



playerDirection =
angle + 90;



if(playerDirection < 0){

playerDirection += 360;

}



if(playerDirection >= 360){

playerDirection -= 360;

}



needle.style.transform =
"rotate("
+
playerDirection
+
"deg)";



});








function facingGhost(){


if(!ghost)
return false;



let difference =
Math.abs(
playerDirection -
ghost.direction
);



if(difference > 180){

difference =
360 - difference;

}



return difference < 35;


}









function getEMF(){



if(!facingGhost()){

return 0;

}





if(
ghost.evidence.includes(
"EMF Level 5")
){


if(
Math.random() < 0.15
){

return 5;

}


}




return Math.floor(
Math.random()*4
)+1;



}









function makeBeep(level){



if(level <= 0)
return;



let audio =
new AudioContext();



let oscillator =
audio.createOscillator();



let gain =
audio.createGain();



oscillator.type =
"square";



oscillator.frequency.value =
250 + (level * 180);



gain.gain.value =
0.08;



oscillator.connect(gain);

gain.connect(
audio.destination
);



oscillator.start();


oscillator.stop(
audio.currentTime + 0.12
);



}










function updateEMF(){



ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



currentEMF =
getEMF();



let screen =
document.getElementById("screen");



screen.innerHTML =
"EMF "
+
currentEMF;




screen.style.background =
"#001800";



if(currentEMF === 0){

screen.style.color="#00ff00";
screen.style.boxShadow="0 0 15px green";

}


if(currentEMF === 1){

screen.style.color="lime";
screen.style.boxShadow="0 0 25px lime";

}


if(currentEMF === 2){

screen.style.color="yellow";
screen.style.boxShadow="0 0 35px yellow";

}


if(currentEMF === 3){

screen.style.color="orange";
screen.style.boxShadow="0 0 45px orange";

}


if(currentEMF === 4){

screen.style.color="red";
screen.style.boxShadow="0 0 60px red";

}


if(currentEMF === 5){

screen.style.color="white";
screen.style.background="darkred";
screen.style.boxShadow="0 0 90px red";

}




if(currentEMF > 0){

document.getElementById("status")
.innerHTML =
"⚠️ Signal detected";


makeBeep(currentEMF);


}

else if(!realCompass){


document.getElementById("status")
.innerHTML =
"🧭 Manual compass mode";


}




document.getElementById("direction")
.innerHTML =
"Direction: "
+
Math.round(playerDirection)
+
"°";



let delay =
Math.random()*1200 + 700;



setTimeout(
updateEMF,
delay
);


}





updateEMF();



</script>


</body>

</html>
