<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:30px;
}


h1 {
    font-size:40px;
}


#device {

    width:330px;
    margin:auto;
    background:#111;
    border:6px solid #444;
    border-radius:30px;
    padding:20px;

}


#screen {

    height:150px;
    background:#003300;
    color:#00ff00;
    font-size:60px;
    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:25px;

}


button {

    font-size:20px;
    padding:12px;
    border-radius:15px;

}


#compass {

    width:220px;
    height:220px;
    border:5px solid white;
    border-radius:50%;
    margin:30px auto;
    position:relative;
    touch-action:none;

}


#needle {

    position:absolute;
    top:20px;
    left:105px;

    width:10px;
    height:90px;

    background:red;

    transform-origin:bottom;

}



#direction {

    font-size:22px;
    color:#aaa;

}


#status {

    font-size:25px;

}


</style>

</head>


<body>


<h1>📟 EMF Reader</h1>


<div id="device">


<div id="screen">
EMF 0
</div>


<div id="status">
Searching...
</div>



<div id="compass">

<div id="needle"></div>

</div>


</div>


<div id="direction">
Direction: 0°
</div>


<audio id="beep" src="beep.mp3"></audio>



<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let playerDirection = 0;



let dragging = false;



const compass =
document.getElementById("compass");

const needle =
document.getElementById("needle");





// Compass dragging

compass.addEventListener(
"pointerdown",
function(){

    dragging=true;

});



window.addEventListener(
"pointerup",
function(){

    dragging=false;

});



window.addEventListener(
"pointermove",
function(e){


if(!dragging) return;



let rect =
compass.getBoundingClientRect();



let x =
e.clientX - 
(rect.left + rect.width/2);



let y =
e.clientY -
(rect.top + rect.height/2);



let angle =
Math.atan2(y,x)
*
180
/
Math.PI;



playerDirection =
angle + 90;



if(playerDirection < 0){

    playerDirection += 360;

}



needle.style.transform =
"rotate(" 
+
playerDirection
+
"deg)";



document.getElementById("direction")
.innerHTML =
"Direction: "
+
Math.round(playerDirection)
+
"°";



});





function facingGhost(){


if(!ghost){

return false;

}



let difference =
Math.abs(
playerDirection -
ghost.direction
);



if(difference > 180){

difference =
360-difference;

}



return difference < 35;



}





function getEMF(){



if(!facingGhost()){

return 0;

}



if(
ghost.evidence.includes(
"EMF Level 5")
){


if(Math.random() < 0.15){

return 5;

}


}



return Math.floor(
Math.random()*4
)+1;



}




function beep(level){


let sound =
document.getElementById("beep");


if(level <= 0)
return;



sound.play();


let delay =
1500 -
(level * 250);



setTimeout(function(){


if(currentEMF === level){

beep(level);

}


},delay);



}



let currentEMF = 0;



function update(){



currentEMF =
getEMF();



let screen =
document.getElementById("screen");



screen.innerHTML =
"EMF "
+
currentEMF;



if(currentEMF === 0){

screen.style.color =
"#00ff00";

screen.style.background =
"#003300";

}



if(currentEMF === 1){

screen.style.color =
"lime";

}



if(currentEMF === 2){

screen.style.color =
"yellow";

}



if(currentEMF === 3){

screen.style.color =
"orange";

}



if(currentEMF === 4){

screen.style.color =
"red";

}



if(currentEMF === 5){

screen.style.color =
"white";

screen.style.background =
"red";

}



beep(currentEMF);



let wait =
Math.random()*1500+700;



setTimeout(update,wait);



}



update();



</script>


</body>

</html>
