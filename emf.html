<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding-top:40px;
}


h1 {
    font-size:40px;
}


#device {

    width:320px;
    height:420px;
    margin:auto;
    background:#111;
    border:5px solid #444;
    border-radius:25px;
    padding:20px;
    box-shadow:0 0 30px black;

}


#screen {

    background:#001900;
    color:#00ff00;
    height:160px;
    border-radius:15px;
    font-size:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:30px;

}



button {

    font-size:22px;
    padding:15px 25px;
    border-radius:12px;
    cursor:pointer;

}


#direction {

    margin-top:20px;
    font-size:18px;
    color:#aaa;

}


#status {

    font-size:25px;
    margin-top:20px;

}


</style>

</head>


<body>


<h1>📟 EMF Reader</h1>


<div id="device">


<div id="screen">
EMF 0
</div>


<button onclick="enableSensors()">
Enable Compass
</button>


<div id="status">
Searching...
</div>


</div>


<div id="direction">
Waiting for sensor...
</div>



<script>


let ghost = JSON.parse(
    localStorage.getItem("currentGhost")
);



let phoneDirection = 0;



// Read phone direction

window.addEventListener(
"deviceorientation",
function(event){


    if(event.alpha !== null){

        phoneDirection = event.alpha;


        document.getElementById("direction").innerHTML =
        "Phone: " + Math.round(phoneDirection)
        +
        "<br>Ghost: " +
        (ghost ? ghost.direction : "none");


    }


});




// Android normally doesn't need this,
// but keeps it compatible

function enableSensors(){

    document.getElementById("status").innerHTML =
    "Sensors active";


}



// Check if looking at ghost

function facingGhost(){


    if(!ghost){
        return false;
    }


    let difference =
    Math.abs(
        phoneDirection -
        ghost.direction
    );


    if(difference > 180){

        difference =
        360 - difference;

    }


    return difference < 35;


}




function getEMF(){



    if(!facingGhost()){

        return 0;

    }



    let hasEMF5 =
    ghost.evidence.includes(
        "EMF Level 5"
    );



    if(hasEMF5){


        // 15% chance of EMF 5

        if(Math.random() < 0.15){

            return 5;

        }


    }



    // Normal readings 1-4

    return Math.floor(
        Math.random()*4
    ) + 1;



}




function updateEMF(){


    let reading =
    getEMF();



    document.getElementById("screen")
    .innerHTML =
    "EMF " + reading;



    if(reading === 5){

        document.getElementById("status")
        .innerHTML =
        "⚠️ Strong Signal";

    }

    else if(reading > 0){

        document.getElementById("status")
        .innerHTML =
        "Signal Detected";

    }

    else{

        document.getElementById("status")
        .innerHTML =
        "Searching...";

    }


}




setInterval(
updateEMF,
1000
);



</script>


</body>

</html>
