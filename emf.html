<!DOCTYPE html>
<html>

<head>
<title>EMF Reader</title>

<style>

body {
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
    margin-top:80px;
}

#emf {
    font-size:50px;
    margin:40px;
}

</style>

</head>


<body>

<h1>📟 EMF Reader</h1>

<button onclick="enableSensors()">
Enable Compass
</button>
    
<div id="emf">
EMF 0
</div>

    <div id="direction">
Phone direction: waiting...
</div>

<script>

window.addEventListener("deviceorientation", function(event){

    console.log(event);

    document.getElementById("direction").innerHTML =
    "Alpha: " + event.alpha +
    "<br>Beta: " + event.beta +
    "<br>Gamma: " + event.gamma;

});

});
    
function enableSensors(){

    if(
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
    ){

        DeviceOrientationEvent.requestPermission()
        .then(response => {

            if(response === "granted"){

                alert("Compass enabled");

            }

        });

    }

}
    
let ghost = JSON.parse(
    localStorage.getItem("currentGhost")
);


let phoneDirection = 0;



window.addEventListener("deviceorientation", function(event){

    phoneDirection = event.alpha;

});



function facingGhost(){


    if(!ghost){
        return false;
    }


    let difference =
    Math.abs(phoneDirection - ghost.direction);



    if(difference > 180){

        difference = 360 - difference;

    }



    return difference <= 30;

}





function getEMFReading(){


    if(!facingGhost()){

        return 0;

    }



    if(ghost.evidence.includes("EMF Level 5")){


        if(Math.random() < 0.10){

            return 5;

        }

    }



    return Math.floor(Math.random() * 4) + 1;

}





setInterval(function(){


    let reading = getEMFReading();


    document.getElementById("emf").innerHTML =
    "EMF " + reading;



},1000);



</script>


</body>

</html>
