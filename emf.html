<!DOCTYPE html>
<html>

<head>

<title>EMF Reader</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:40px;
}


h1 {
    font-size:42px;
}


#emfDevice {

    width:330px;
    height:450px;
    margin:auto;
    background:#151515;
    border:6px solid #333;
    border-radius:30px;
    padding:20px;

}


#screen {

    height:150px;
    background:#001a00;
    border-radius:15px;
    color:#00ff00;
    font-size:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:30px;

}


button {

    font-size:24px;
    padding:15px 25px;
    border-radius:15px;

}


#status {

    margin-top:25px;
    font-size:25px;

}


#debug {

    margin-top:30px;
    color:#aaa;
    font-size:18px;

}


</style>

</head>


<body>


<h1>📟 EMF Reader</h1>


<div id="emfDevice">


<div id="screen">
EMF 0
</div>


<button onclick="startSensors()">
Start Sensor
</button>


<div id="status">
Waiting...
</div>


</div>


<div id="debug">
No sensor data
</div>



<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let phoneDirection = 0;

let sensorStarted = false;




function startSensors(){


    sensorStarted = true;


    window.addEventListener(
    "deviceorientation",
    function(event){


        if(event.alpha !== null){


            phoneDirection =
            event.alpha;



            document.getElementById("debug")
            .innerHTML =

            "Phone direction: "
            +
            Math.round(phoneDirection)

            +

            "<br>Ghost direction: "
            +
            (ghost ? ghost.direction : "none");



        }


    });



    document.getElementById("status")
    .innerHTML =
    "Sensor started";

}





function facingGhost(){


    if(!ghost){
        return false;
    }



    let difference =
    Math.abs(
        phoneDirection -
        ghost.direction
    );



    if(difference > 180){

        difference =
        360 - difference;

    }



    return difference < 35;


}





function getEMF(){



    if(!facingGhost()){

        return 0;

    }




    if(
    ghost.evidence.includes("EMF Level 5")
    ){



        if(
        Math.random() < 0.15
        ){

            return 5;

        }


    }



    return (
    Math.floor(
    Math.random()*4
    )
    +1
    );


}





setInterval(function(){



    let reading =
    getEMF();



    document.getElementById("screen")
    .innerHTML =
    "EMF "
    +
    reading;



},1000);



</script>


</body>

</html>
