<!DOCTYPE html>
<html>

<head>

<title>Spirit Box</title>

<style>

body {

background:#080808;
color:white;
font-family:Arial;
text-align:center;
padding-top:20px;

}


h1 {

font-size:45px;
text-shadow:0 0 20px cyan;

}



#radio {

width:380px;

margin:auto;

background:#222;

border:5px solid #666;

border-radius:25px;

padding:25px;

box-shadow:
0 0 30px black;

}



#frequency {

background:#001111;

color:#00ffff;

font-size:40px;

padding:20px;

border-radius:15px;

box-shadow:
0 0 20px cyan;

}



#signal {

font-size:35px;

margin:20px;

color:#00ff00;

}



#screen {

height:100px;

background:#111;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

}



button {

font-size:25px;

padding:15px 30px;

border-radius:15px;

margin:15px;

cursor:pointer;

}



#heard {

color:#aaa;

font-size:20px;

}



#reply {

font-size:28px;

margin-top:20px;

}



</style>


</head>



<body>



<h1>📻 SPIRIT BOX</h1>



<div id="radio">



<div id="frequency">

102.5 MHz

</div>



<div id="signal">

▮▮▯▯▯

</div>



<div id="screen">

POWER OFF

</div>



<button onclick="toggleBox()">

POWER

</button>



<div id="heard">

Heard: -

</div>



<div id="reply">

Response: -

</div>



</div>





<audio id="staticNoise" loop>

<source src="static.mp3" type="audio/mpeg">

</audio>







<script>



let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let spiritOn=false;

let recognition;



const staticNoise =
document.getElementById(
"staticNoise"
);





const questions = {


"are you here":[
"Yes",
"I am here",
"You found me"
],


"where are you":[
"Nearby",
"Close",
"Behind you"
],


"give us a sign":[
"Look",
"Listen",
"Now"
],


"how old are you":[
"Very old",
"I forgot",
"Long ago"
],


"can you talk":[
"Yes",
"I can hear you"
]


};








function toggleBox(){



let screen =
document.getElementById(
"screen"
);



if(spiritOn){


spiritOn=false;


screen.innerHTML =
"POWER OFF";


staticNoise.pause();

staticNoise.currentTime=0;


if(recognition){

recognition.stop();

}



return;


}




spiritOn=true;


screen.innerHTML =
"SCANNING...";



staticNoise.volume=0.25;


staticNoise.play();



startListening();



}









function startListening(){



const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert(
"Speech recognition not supported"
);

return;

}



recognition =
new SpeechRecognition();



recognition.lang="en-GB";


recognition.continuous=true;


recognition.interimResults=false;






recognition.onresult=function(event){



let text =
event.results
[event.results.length-1]
[0]
.transcript
.toLowerCase();



document.getElementById("heard")
.innerHTML =
"Heard: "
+
text;



checkQuestion(text);



};







recognition.onerror=function(){



if(spiritOn){


setTimeout(()=>{

recognition.start();

},500);



}



};



recognition.start();



}









function checkQuestion(text){



if(!ghost)
return;



if(
!ghost.evidence.includes(
"Spirit Box")
){

return;

}



for(let q in questions){


if(text.includes(q)){



if(Math.random()<0.7){



let answer =
questions[q]
[
Math.floor(
Math.random()
*
questions[q].length
)
];



reply(answer);



}



break;


}



}



}









function reply(text){



let screen =
document.getElementById(
"screen"
);



screen.innerHTML =
text;



screen.style.color="red";


screen.style.boxShadow =
"0 0 40px red";




document.getElementById("reply")
.innerHTML =
"Response: "
+
text;





let voice =
new SpeechSynthesisUtterance(
text
);



voice.pitch=0.25;

voice.rate=0.65;


speechSynthesis.speak(
voice
);





setTimeout(()=>{


screen.innerHTML =
"SCANNING...";


screen.style.color="white";

screen.style.boxShadow="none";


},3000);



}








setInterval(()=>{



if(!spiritOn)
return;



let freq =
(100+
Math.random()*20)
.toFixed(1);



document.getElementById(
"frequency"
)
.innerHTML =
freq+" MHz";




let bars =
Math.floor(
Math.random()*5
)+1;



document.getElementById(
"signal"
)
.innerHTML =
"▮".repeat(bars)
+
"▯".repeat(5-bars);



},500);





</script>


</body>

</html>
