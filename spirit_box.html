<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Spirit Box</title>

<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin-top: 80px;
}

h1 {
    font-size: 40px;
}

button {
    font-size: 24px;
    padding: 15px 35px;
    cursor: pointer;
    border-radius: 10px;
}

#heard, #reply, #status {
    margin: 25px;
    font-size: 25px;
}
</style>

</head>

<body>

<h1>Spirit Box</h1>

<audio id="staticNoise" loop>
    <source src="static.mp3" type="audio/mpeg">
</audio>

<button onclick="startSpiritBox()">Start Spirit Box</button>

<div id="status">Status: Off</div>
<div id="heard">Heard: waiting...</div>
<div id="reply"></div>


<script>

const responses = {

"are you here": [
    "Yes.",
    "I am here.",
    "Hello.",
    "I hear you.",
    "Maybe."
],

"where are you": [
    "Nearby.",
    "Behind you.",
    "Close.",
    "I cannot say."
],

"how old are you": [
    "I don't remember.",
    "Very old.",
    "Unknown.",
    "A long time ago."
],

"can you talk to us": [
    "Yes.",
    "I am listening.",
    "I can hear you."
],

"give us a sign": [
    "Look.",
    "Wait.",
    "Listen.",
    "Soon."
],

"do you want to hurt us": [
    "No.",
    "Never.",
    "I mean no harm."
]

};


let spiritActive = false;
let started = false;



function startSpiritBox() {

let noise = document.getElementById("staticNoise");

noise.volume = 0.15;
noise.play();


// Only roll once per session
if (!started) {

    spiritActive = Math.random() < (14/30);
    started = true;


    if (spiritActive) {

        document.getElementById("status").innerHTML =
        "Status: Active";

    } else {

        document.getElementById("status").innerHTML =
        "Status: Silent";

    }

}


listen();

}




function listen() {


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

alert("Speech recognition is not supported.");

return;

}



let recognition = new SpeechRecognition();


recognition.lang = "en-GB";
recognition.continuous = false;
recognition.interimResults = false;



// Clear old response every time it listens
document.getElementById("reply").innerHTML = "";

document.getElementById("heard").innerHTML =
"Listening...";


recognition.start();



recognition.onresult = function(event) {


let text =
event.results[0][0].transcript.toLowerCase();


document.getElementById("heard").innerHTML =
"Heard: " + text;


// Inactive = ignore
if (!spiritActive) {

return;

}


// Check questions
for (let question in responses) {


if (text.includes(question)) {


 // 1/3 chance to answer
if (Math.random() > (1/3)) {
    return;
}


    let answer =
    responses[question]
    [
    Math.floor(
    Math.random() *
    responses[question].length
    )
    ];



    sayReply(answer);


    return;

}


}


// Not a recognized question
return;


};



recognition.onerror = function(event) {

console.log(event.error);

};


}




function sayReply(answer) {


document.getElementById("reply").innerHTML =
"Response: " + answer;


let voice =
new SpeechSynthesisUtterance(answer);


voice.rate = 0.9;


speechSynthesis.speak(voice);

}


</script>

</body>
</html>
