<!DOCTYPE html>
<html>

<head>

<title>Spirit Box</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:20px;

}



h1 {

    font-size:42px;

}



#device {

    width:360px;

    margin:auto;

    background:#111;

    border:6px solid #444;

    border-radius:35px;

    padding:25px;

    box-shadow:
    0 0 40px black;

}



#screen {

    height:140px;

    background:#001900;

    border-radius:20px;

    color:#00ff00;

    font-size:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
    0 0 25px #00ff00;

    transition:0.3s;

}



#frequency {

    margin-top:15px;

    font-size:28px;

    color:#aaa;

}



#bars {

    margin:20px;

    font-size:30px;

    letter-spacing:5px;

    color:#00ff00;

}



button {

    font-size:22px;

    padding:15px 25px;

    border-radius:15px;

    margin:10px;

    cursor:pointer;

}



#heard {

    margin-top:20px;

    color:#aaa;

}



#reply {

    margin-top:20px;

    font-size:26px;

}



.scan {

animation:scan 0.5s infinite alternate;

}


@keyframes scan {


from {

opacity:0.5;

}


to {

opacity:1;

}


}



</style>

</head>


<body>



<h1>🎤 SPIRIT BOX</h1>



<div id="device">


<div id="screen">

OFF

</div>



<div id="frequency">

102.4 MHz

</div>



<div id="bars">

▮▮▯▯▯

</div>



<button onclick="toggleBox()">

POWER

</button>



<div id="heard">

Heard: -

</div>



<div id="reply">

Response: -

</div>



</div>





<script>


let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);



let spiritOn=false;

let recognition;





const questions = {


"are you here":[

"Yes",

"I am here",

"You found me"

],


"where are you":[

"Nearby",

"Close",

"Behind you"

],


"how old are you":[

"I don't remember",

"Very old",

"Long ago"

],


"give us a sign":[

"Look",

"Listen",

"Now"

],


"can you talk":[

"Yes",

"I can hear you"

]


};





function toggleBox(){



let screen =
document.getElementById("screen");



if(spiritOn){


spiritOn=false;


screen.innerHTML="OFF";


screen.classList.remove("scan");



if(recognition){

recognition.stop();

}



return;


}




spiritOn=true;



screen.innerHTML="SCANNING";

screen.classList.add("scan");



startListening();


}





function startListening(){



const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert(
"Speech recognition not supported"
);

return;

}



recognition =
new SpeechRecognition();



recognition.lang="en-GB";


recognition.continuous=true;


recognition.interimResults=false;





recognition.onresult=function(event){



let text =
event.results
[event.results.length-1]
[0]
.transcript
.toLowerCase();



document.getElementById("heard")
.innerHTML=
"Heard: "
+
text;



checkQuestion(text);



};





recognition.onerror=function(){


if(spiritOn){

setTimeout(()=>{

recognition.start();

},500);


}



};



recognition.start();



}







function checkQuestion(text){



if(!ghost)
return;



if(
!ghost.evidence.includes(
"Spirit Box")
){

return;

}




for(let q in questions){



if(text.includes(q)){



if(Math.random()<0.4){



let answer =
questions[q]
[
Math.floor(
Math.random()
*
questions[q].length
)
];



reply(answer);



}



break;



}



}



}








function reply(text){



let screen =
document.getElementById("screen");



screen.innerHTML =
text;



screen.style.color="red";


screen.style.boxShadow=
"0 0 50px red";



document.getElementById("reply")
.innerHTML=
"Response: "
+
text;




let voice =
new SpeechSynthesisUtterance(text);



voice.pitch=0.3;

voice.rate=0.65;


speechSynthesis.speak(
voice
);





setTimeout(()=>{


screen.innerHTML="SCANNING";


screen.style.color="#00ff00";


screen.style.boxShadow=
"0 0 25px #00ff00";


},3000);



}






// fake frequency movement

setInterval(()=>{


if(!spiritOn)
return;



let freq =
(100+Math.random()*10)
.toFixed(1);



document.getElementById("frequency")
.innerHTML =
freq+" MHz";



let strength =
Math.floor(
Math.random()*5
)+1;



document.getElementById("bars")
.innerHTML =
"▮".repeat(strength)
+
"▯".repeat(5-strength);



},500);




</script>


</body>

</html>
