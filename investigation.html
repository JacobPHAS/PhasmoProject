<!DOCTYPE html>
<html>

<head>

<title>Ghost Investigation</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:20px;

}


h1 {

    font-size:45px;
    text-shadow:0 0 20px white;

}


.subtitle {

    color:#aaa;
    font-size:22px;
    margin-bottom:30px;

}



#tools {

    max-width:900px;
    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}



button {

    background:#111;

    color:white;

    border:2px solid #444;

    border-radius:20px;

    padding:25px;

    font-size:24px;

    cursor:pointer;

    transition:0.3s;

}



button:hover {

    background:#222;

    border-color:white;

    box-shadow:
    0 0 25px white;

}



.icon {

    font-size:45px;

}



#status {

    margin-top:35px;

    font-size:24px;

    color:#aaa;

}



#debugGhost {

    margin:35px auto;

    max-width:500px;

    padding:20px;

    border:2px solid #333;

    border-radius:15px;

    color:#777;

}



</style>


</head>



<body>



<h1>👻 Investigation Started</h1>


<div class="subtitle">

Find evidence and identify the ghost

</div>




<div id="tools">



<button onclick="location.href='spirit_box.html'">

<div class="icon">🎤</div>

Spirit Box

</button>




<button onclick="location.href='emf.html'">

<div class="icon">📟</div>

EMF Reader

</button>




<button onclick="location.href='thermometer.html'">

<div class="icon">🌡️</div>

Thermometer

</button>




<button onclick="location.href='camera.html'">

<div class="icon">📹</div>

Video Camera

</button>




<button onclick="location.href='uv.html'">

<div class="icon">🔦</div>

UV Light

</button>




<button onclick="location.href='dots.html'">

<div class="icon">🟢</div>

D.O.T.S Projector

</button>




<button onclick="location.href='journal.html'">

<div class="icon">📖</div>

Ghost Writing Book

</button>



</div>





<div id="status">

Ghost activity: Searching...

</div>





<div id="debugGhost">

Loading ghost...

</div>






<script>



let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);





if(!ghost){


document.getElementById("debugGhost")
.innerHTML =
"No ghost selected";



}

else{



// Create direction if missing

if(
ghost.direction === undefined
){


ghost.direction =
Math.floor(
Math.random()*360
);

ghost.distance =
Number(
(Math.random() * 1.4 + 0.1).toFixed(1)
);

localStorage.setItem(
"currentGhost",
JSON.stringify(ghost)
);



}



showGhost();



}








function showGhost(){


document.getElementById("debugGhost").innerHTML =

"🧪 Testing Mode"
+
"<br><br>"
+
"Ghost: "
+
ghost.name
+
"<br>Evidence: "
+
ghost.evidence.join(", ")
+
"<br>Direction: "
+
Math.round(ghost.direction)
+
"°"
+
"<br>Distance: "
+
ghost.distance
+
"m";



}








// Ghost slowly wanders


function moveGhost(){



if(!ghost)
return;



let movement =
Math.floor(
Math.random()*21
)-10;



ghost.direction += movement;



if(
ghost.direction < 0
){

ghost.direction +=360;

}



if(
ghost.direction >=360
){

ghost.direction -=360;

}



localStorage.setItem(

"currentGhost",

JSON.stringify(ghost)

);



showGhost();



}






// Move ghost every 15 seconds

setInterval(
moveGhost,
15000
);





</script>



</body>

</html>
