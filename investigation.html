<!DOCTYPE html>
<html>

<head>

<title>Investigation</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;

}



h1 {

    font-size:45px;

}



.subtitle {

    color:#aaa;
    font-size:22px;

}



#tools {

    max-width:700px;
    margin:auto;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

    gap:20px;

}



button {

    background:#111;

    color:white;

    border:2px solid #555;

    border-radius:20px;

    padding:25px;

    font-size:24px;

    cursor:pointer;

    transition:0.3s;

}



button:hover {

    background:#333;

    box-shadow:
    0 0 20px white;

}



#debugGhost {

    margin-top:40px;

    padding:20px;

    border:2px solid #333;

    border-radius:15px;

    color:#777;

}



#status {

    margin-top:20px;

    font-size:22px;

    color:#aaa;

}



</style>


</head>


<body>


<h1>👻 Investigation</h1>


<div class="subtitle">

Find evidence. Identify the ghost.

</div>



<br>



<div id="tools">


<button onclick="location.href='spirit_box.html'">

🎤<br>
Spirit Box

</button>



<button onclick="location.href='emf.html'">

📟<br>
EMF Reader

</button>



<button onclick="location.href='uv.html'">

🔦<br>
UV Light

</button>



<button onclick="location.href='dots.html'">

🟢<br>
D.O.T.S

</button>



<button onclick="location.href='journal.html'">

📖<br>
Ghost Writing Book

</button>


</div>





<div id="status">

Ghost activity: Searching...

</div>





<div id="debugGhost">

Loading ghost...

</div>





<script>





let ghost =
JSON.parse(
localStorage.getItem("currentGhost")
);





if(!ghost){


document.getElementById("debugGhost")
.innerHTML =
"No ghost selected";


}

else{



// Give ghost direction if missing

if(ghost.direction === undefined){


ghost.direction =
Math.floor(
Math.random()*360
);


localStorage.setItem(
"currentGhost",
JSON.stringify(ghost)
);


}



showGhost();



}









function showGhost(){


document.getElementById("debugGhost")
.innerHTML =


"Testing Ghost: "
+
ghost.name
+

"<br>Evidence: "
+
ghost.evidence.join(", ")

+

"<br>Direction: "
+
Math.round(ghost.direction)
+
"°";


}









// Ghost wandering system


function moveGhost(){



if(!ghost)
return;



let movement =
Math.floor(Math.random()*21)-10;



ghost.direction += movement;



if(ghost.direction < 0){

ghost.direction +=360;

}



if(ghost.direction >=360){

ghost.direction -=360;

}




localStorage.setItem(

"currentGhost",

JSON.stringify(ghost)

);



showGhost();



}





// ghost moves every 15 seconds

setInterval(
moveGhost,
15000
);





</script>



</body>


</html>
