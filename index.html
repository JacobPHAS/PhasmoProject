<!DOCTYPE html>
<html>

<head>

<title>Ghost Investigation</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding-top:60px;

}


h1 {

    font-size:50px;
    text-shadow:0 0 25px cyan;

}


button {

    margin-top:40px;

    padding:20px 50px;

    font-size:25px;

    border-radius:20px;

    border:2px solid cyan;

    background:#111;

    color:white;

    cursor:pointer;

    box-shadow:0 0 20px cyan;

}


button:hover {

    background:#222;

}


#status {

    margin-top:30px;

    color:#aaa;

    font-size:20px;

}

</style>

</head>



<body>


<h1>👻 Ghost Hunter</h1>

<p>
Start a new investigation
</p>


<button id="startBtn">
Start Investigation
</button>


<div id="status"></div>





<!-- YOUR GHOST FILE MUST BE HERE -->
<script src="ghosts.js"></script>



<script>


window.onload = function(){



const button =
document.getElementById("startBtn");



button.onclick = function(){



    if(typeof ghosts === "undefined"){


        document.getElementById("status")
        .innerHTML =
        "❌ Ghost list not loaded";


        console.log(
        "ghosts.js is missing or loaded after this file"
        );


        return;

    }






    let chosenGhost =
    ghosts[
        Math.floor(
            Math.random() * ghosts.length
        )
    ];






    let currentGhost = {


        name:
        chosenGhost.name,


        evidence:
        chosenGhost.evidence,


        direction:
        Math.floor(
            Math.random()*360
        ),


        distance:
        Number(
            (Math.random()*1.4+0.1)
            .toFixed(1)
        )


    };






    localStorage.setItem(
        "currentGhost",
        JSON.stringify(currentGhost)
    );






    document.getElementById("status")
    .innerHTML =
    "👻 Ghost found!";






    setTimeout(function(){


        window.location.href =
        "investigation.html";


    },800);



};



};



</script>



</body>

</html>
