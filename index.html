<!DOCTYPE html>
<html>

<head>

<title>Ghost Hunter</title>

<style>

body {

    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding-top:40px;

}


h1 {

    font-size:50px;
    text-shadow:0 0 25px white;

}



p {

    color:#aaa;
    font-size:22px;

}



button {

    background:#111;

    color:white;

    border:2px solid #555;

    border-radius:20px;

    padding:20px 40px;

    font-size:25px;

    cursor:pointer;

    margin-top:30px;

}



button:hover {

    background:#333;

    box-shadow:0 0 25px white;

}



#ghostInfo {

    margin:30px auto;

    color:#777;

    font-size:18px;

}



</style>

</head>



<body>



<h1>👻 Ghost Hunter</h1>


<p>

Enter the investigation

</p>




<button onclick="startInvestigation()">

Start Investigation

</button>



<div id="ghostInfo">

</div>





<script>



const ghosts = [


{

name:"Wraith",

evidence:[
"EMF Level 5",
"Spirit Box",
"DOTS"
]

},



{

name:"Phantom",

evidence:[
"Spirit Box",
"UV",
"DOTS"
]

},



{

name:"Banshee",

evidence:[
"EMF Level 5",
"DOTS",
"UV"
]

},



{

name:"Shade",

evidence:[
"EMF Level 5",
"Ghost Writing",
"Freezing Temps"
]

},



{

name:"Demon",

evidence:[
"Freezing Temps",
"Ghost Writing",
"UV"
]

}



];








function startInvestigation(){



let chosenGhost =
ghosts[
Math.floor(
Math.random()*ghosts.length
)
];





let currentGhost = {


name:
chosenGhost.name,


evidence:
chosenGhost.evidence,



direction:
Math.floor(
Math.random()*360
),










localStorage.setItem(

"currentGhost",

JSON.stringify(currentGhost)

);





location.href =
"investigation.html";



}





</script>




</body>

</html>
